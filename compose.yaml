services:
  antigo-advisory-mysql:
    image: mysql:8.0
    container_name: antigo-advisory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3310:3306"
    volumes:
      - antigo-advisory-db-data:/var/lib/mysql
    networks:
      - antigo-advisory-network

  antigoadvisoryphpmyadmin:
    image: phpmyadmin
    container_name: antigo-advisory-phpmyadmin
    restart: unless-stopped
    environment: 
      PMA_HOST: antigo-advisory-mysql
    ports:
      - "8080:80"
    networks:
      - antigo-advisory-network

volumes:
  antigo-advisory-db-data:

networks:
  antigo-advisory-network:
